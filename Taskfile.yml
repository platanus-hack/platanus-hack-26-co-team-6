version: "3"

# PULSO — monorepo task runner.
#
# Three apps, three package managers, three ports:
#   apps/frontend        Next.js   pnpm   :3000   (browser-facing)
#   apps/backend/core    NestJS    pnpm   :3001   (gateway, owns CORS)
#   apps/backend/ai-core FastAPI   uv     :8000   (internal, no CORS)
#
# Run `task doctor` before `task dev` when something feels wrong.

vars:
  FRONTEND: apps/frontend
  CORE: apps/backend/core
  AI_CORE: apps/backend/ai-core
  VOZ: apps/services/voz

  # Single source of truth for the dev ports: `dev` binds them and `doctor`
  # checks them. Override per run, e.g. `task dev PORT_CORE=3005`.
  PORT_FRONTEND: '{{.PORT_FRONTEND | default "3000"}}'
  PORT_CORE: '{{.PORT_CORE | default "3001"}}'
  PORT_AI_CORE: '{{.PORT_AI_CORE | default "8000"}}'
  PORT_VOZ: '{{.PORT_VOZ | default "8090"}}'

tasks:
  default:
    desc: List the available tasks.
    cmds:
      - task --list
    silent: true

  # ---------------------------------------------------------------- dev ---

  dev:
    desc: Start frontend, core and ai-core at the same time.
    # `deps` run in parallel. Ctrl-C stops all three.
    deps:
      - dev:frontend
      - dev:core
      - dev:ai-core
      - dev:voz

  dev:frontend:
    desc: Next.js dev server (default :3000).
    dir: "{{.FRONTEND}}"
    cmds:
      # --port, not $PORT: Next only honours the flag reliably across versions.
      - pnpm dev --port {{.PORT_FRONTEND}}

  dev:core:
    desc: NestJS gateway in watch mode (default :3001).
    dir: "{{.CORE}}"
    env:
      # src/main.ts reads process.env.PORT. There is no ConfigModule yet, so
      # apps/backend/core/.env is NOT loaded by Nest — this is what binds it.
      PORT: "{{.PORT_CORE}}"
    cmds:
      - pnpm start:dev

  dev:voz:
    desc: Canal público (WhatsApp + telefonía). El único con cara a internet.
    dir: "{{.VOZ}}"
    cmds:
      - uv run uvicorn app.main:app --reload --port {{.PORT_VOZ}}

  dev:ai-core:
    desc: FastAPI service with reload (default :8000).
    dir: "{{.AI_CORE}}"
    cmds:
      # uvicorn, not `fastapi dev`: the fastapi CLI needs fastapi[standard],
      # and pyproject.toml declares plain `fastapi` + `uvicorn[standard]`.
      - uv run uvicorn app.main:app --reload --port {{.PORT_AI_CORE}}

  # -------------------------------------------------------------- setup ---

  setup:
    desc: Install every dependency and create the local env files.
    cmds:
      - task: setup:env
      - task: setup:frontend
      - task: setup:core
      - task: setup:ai-core
      - cmd: echo "Setup complete. Run 'task doctor' to verify, then 'task dev'."
        silent: true

  setup:env:
    desc: Copy the env examples into real local env files (never overwrites).
    cmds:
      # Node does the copying so this works the same in PowerShell, cmd and bash.
      - node scripts/setup-env.mjs

  setup:frontend:
    desc: Install frontend dependencies.
    dir: "{{.FRONTEND}}"
    cmds:
      - pnpm install

  setup:core:
    desc: Install core dependencies.
    dir: "{{.CORE}}"
    cmds:
      - pnpm install

  setup:ai-core:
    desc: Create the ai-core virtualenv and sync its dependencies.
    dir: "{{.AI_CORE}}"
    cmds:
      # `uv sync` creates .venv when missing and installs the dev group too.
      - uv sync --all-groups

  # ------------------------------------------------------------- doctor ---

  doctor:
    desc: Check tooling, virtualenv, dependencies, env files and free ports.
    env:
      # Same ports `dev` binds, so doctor never checks the wrong ones.
      PORT_FRONTEND: "{{.PORT_FRONTEND}}"
      PORT_CORE: "{{.PORT_CORE}}"
      PORT_AI_CORE: "{{.PORT_AI_CORE}}"
    cmds:
      - node scripts/doctor.mjs

  # ----------------------------------------------------------- migrations ---

  migrate:
    desc: Apply pending PostgreSQL migrations.
    dir: "{{.CORE}}"
    cmds:
      - pnpm run migrate -- up

  migrate:seed:
    desc: Seed PostgreSQL (FUENTE=semillas or FUENTE=csv).
    dir: "{{.CORE}}"
    vars:
      FUENTE: '{{.FUENTE | default "semillas"}}'
    cmds:
      - pnpm run migrate -- seed --fuente={{.FUENTE}}

  migrate:status:
    desc: Show applied, pending and modified migrations.
    dir: "{{.CORE}}"
    cmds:
      - pnpm run migrate -- status

  migrate:verify:
    desc: Verify migrated data and the nearby-facilities RPC.
    dir: "{{.CORE}}"
    cmds:
      - pnpm run migrate -- verify
  # --------------------------------------------------------------- data ---

  datos:descargar:
    desc: Download the Bogota REPS sources (17 MB, not committed).
    cmds:
      - python scripts/datos/descargar.py

  datos:
    desc: Rebuild data/procesado and the generated TypeScript from data/.
    cmds:
      # Solo stdlib de Python: no necesita el venv de ai-core ni pip install.
      - python scripts/datos/construir.py

  datos:catalogo:
    desc: Regenerate data/CATALOGO.md only (fast, no transforms).
    cmds:
      - python -c "import sys; sys.path.insert(0, 'scripts/datos'); import catalogar; catalogar.construir()"
      - echo "data/CATALOGO.md actualizado"

  # --------------------------------------------------------------- misc ---

  verificar:tipos:
    desc: Check that lib/types.ts still mirrors contracts/types.ts (task 0.7).
    cmds:
      # Structural comparison, not textual: both files carry different
      # comments and quote styles on purpose.
      - node scripts/verificar-tipos.mts

  build:
    desc: Production build for frontend and core.
    cmds:
      # First: a green build with a diverged mirror is exactly the failure
      # this check exists to prevent. It compiles on both sides and breaks
      # at runtime, in front of the audience.
      - task: verificar:tipos
      - task: build:frontend
      - task: build:core

  build:frontend:
    dir: "{{.FRONTEND}}"
    cmds:
      - pnpm build

  build:core:
    dir: "{{.CORE}}"
    cmds:
      - pnpm build

  test:
    desc: Run the test suites that exist today.
    cmds:
      - task: test:tipos
      - task: test:frontend
      - task: test:core
      - task: test:ai-core
      - task: test:voz

  test:tipos:
    desc: Tests of the type-mirror verifier itself.
    cmds:
      # node --test, no jest/vitest: the repo root has no test runner and
      # adding one for two files would cost more than the problem.
      - node --test scripts/verificar-tipos.test.mts

  test:frontend:
    desc: Frontend logic that must not be wrong. No runner: node --test.
    dir: "{{.FRONTEND}}"
    cmds:
      # Solo lo que se puede probar sin DOM: el modelo de sesión (quien puede
      # que y a donde va). Las vistas se prueban en el telefono del demo.
      - pnpm test

  test:core:
    dir: "{{.CORE}}"
    cmds:
      - pnpm test

  test:ai-core:
    dir: "{{.AI_CORE}}"
    cmds:
      - uv run pytest

  test:voz:
    desc: Voz test suite. The Postgres-backed dedup tests skip without a DB.
    dir: "{{.VOZ}}"
    cmds:
      # PULSO_TEST_DATABASE_URL enables tests/test_deduplicacion_postgres.py,
      # the only place the insert-on-conflict lock is exercised for real.
      - uv run pytest

  typecheck:
    desc: Type-check the frontend. Must pass before every push.
    dir: "{{.FRONTEND}}"
    cmds:
      - pnpm typecheck
