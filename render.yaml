# Blueprint de Render para PULSO.
#
#   render.com → New → Blueprint → apuntar a este repo, rama main
#
# CUATRO servicios. Tres públicos, UNO privado — y el privado es el que importa:
#
#   pulso-frontend web   :3000  ← las consolas, desde cualquier celular del mundo
#   pulso-core     web   :3001  ← la API. Pública, pero NIEGA POR DEFECTO.
#   pulso-voz      web   :8090  ← Meta/Kapso y Twilio lo alcanzan desde internet
#   pulso-ai-core  pserv :8000  ← PRIVADO. Anthropic y ElevenLabs viven acá.
#
# POR QUÉ core SÍ PUEDE SER PÚBLICO Y ai-core NO:
#
#   Abrir core expone su SUPERFICIE DE API, no sus credenciales. Las llaves
#   nunca viajan al navegador: el navegador le pide a core, y core llama al
#   proveedor DESDE EL SERVIDOR. Lo que protege esa superficie es SesionGuard,
#   que niega por defecto — sin cookie de sesión, 401 en todo salvo /health y
#   los webhooks. Detrás hay dictado clínico y coordenadas de paciente, así que
#   OPERADOR_PASSWORD tiene que ser larga de verdad, no la del ensayo.
#
#   ai-core NO TIENE AUTENTICACIÓN DE NINGUNA CLASE. Lo único que lo protege es
#   no ser alcanzable. Por eso es el que se queda sin URL pública, y por eso
#   ANTHROPIC_API_KEY y ELEVENLABS_API_KEY viven ahí y en ningún otro lado.
#
# LO QUE EL NAVEGADOR SÍ VE: todo lo que empiece por NEXT_PUBLIC_ se compila
# dentro del bundle que se descarga cualquiera. Ahí sólo van tokens que ya son
# públicos por diseño (el de Mapbox para pintar el mapa, la anon key de
# Supabase sujeta a RLS). Ninguna credencial de servidor entra ahí — está
# escrito en apps/frontend/env.example y sigue siendo cierto.
#
# ⚠️ LOS CUATRO TIENEN QUE ESTAR EN LA MISMA `region` Y EL MISMO WORKSPACE.
#    La red privada de Render es por región + workspace. Si core queda en
#    oregon y ai-core en frankfurt, no se ven y el blueprint no avisa.
#
# ⚠️ `plan: free` NO EXISTE PARA `pserv`. El instance type gratuito sólo cubre
#    web services, Postgres y Key Value. Mantener ai-core fuera de internet
#    cuesta el instance type pagado más barato (starter). No hay tercera
#    opción: o es privado y pagado, o es un web service gratuito y queda
#    expuesto con las llaves detrás.
#
# Las URLs internas van como literales, no con `fromService`: el blueprint no
# sabe concatenar, `fromService` devuelve `host` o `host:puerto` sin esquema,
# y tanto core (`fetch(\`${base}${ruta}\`)`) como voz (httpx) necesitan el
# `http://` delante. El hostname interno es el nombre del servicio — no es un
# secreto, pero VERIFÍCALO en el dashboard después del primer deploy: si el
# nombre chocaba con otro del workspace, Render le pone sufijo.

services:
  # ── ai-core ───────────────────────────────────────────────────────────
  # Primero en el archivo porque es el que no depende de nadie.
  - type: pserv
    name: pulso-ai-core
    runtime: docker
    dockerfilePath: ./apps/backend/ai-core/Dockerfile
    # La RAÍZ del repo, no la carpeta del servicio: la imagen lleva data/.
    dockerContext: .
    plan: starter
    region: oregon
    autoDeployTrigger: "off"

    envVars:
      - key: PORT
        value: 8000

      # ── Las llaves de proveedor. Viven AQUÍ y sólo aquí ────────────────
      # Vacías, ai-core arranca igual: /v1/triage cae al extractor heurístico
      # (confianza 0.35). La excepción es /v1/transcribir, que sin
      # ELEVENLABS_API_KEY responde 503 explícito — el audio de WhatsApp no
      # tiene heurística a la que caer.
      - key: ANTHROPIC_API_KEY
        sync: false

      # ── Transcripción (STT) ───────────────────────────────────────────
      # Dos proveedores detrás de la misma interfaz (transcripcion.py). BASTA
      # UNA de las dos llaves. Con "auto" prefiere Deepgram si está, y si no
      # cae a ElevenLabs; sin ninguna, /v1/transcribir responde 503 explícito
      # — es el único punto de PULSO sin heurística a la que caer.
      - key: STT_PROVEEDOR
        value: auto
      - key: DEEPGRAM_API_KEY
        sync: false

      # ⚠️ ElevenLabs cubre STT **y** TTS con la misma llave. Deepgram sólo
      #    cubre STT: sintesis.py:46 es `bool(elevenlabs_api_key)` y no tiene
      #    otro proveedor. Sin esta llave la transcripción funciona con
      #    Deepgram, pero la llamada de seguimiento se queda sin voz.
      - key: ELEVENLABS_API_KEY
        sync: false

  # ── core ──────────────────────────────────────────────────────────────
  # Público, para que las consolas lo alcancen desde cualquier celular. Lo que
  # lo protege es SesionGuard, no el firewall: sin cookie de sesión responde
  # 401 en todo salvo /health y los webhooks. Verificado.
  - type: web
    name: pulso-core
    runtime: docker
    dockerfilePath: ./apps/backend/core/Dockerfile
    # La RAÍZ del repo, no la carpeta del servicio.
    dockerContext: .
    plan: starter
    region: oregon
    healthCheckPath: /health
    autoDeployTrigger: "off"

    envVars:
      - key: PORT
        value: 3001

      # Hacia adentro, por la red privada.
      - key: AI_CORE_BASE_URL
        value: http://pulso-ai-core:8000
      # Ojo al sufijo /interno: es el prefijo del router que core consume en
      # voz, y voz.client.ts hace `${base}/seguimiento` sin agregarlo.
      - key: VOZ_BASE_URL
        value: http://pulso-voz:8090/interno

      # ── Sesión de operador ────────────────────────────────────────────
      # ⚠️ Si estas dos van vacías, core arranca igual pero se inventa
      #    credenciales aleatorias en CADA reinicio y las escupe al log: las
      #    sesiones mueren en cada deploy y nadie puede entrar dos veces
      #    seguidas con la misma clave.
      #
      # ⚠️ OPERADOR_PASSWORD TIENE QUE SER IDÉNTICA a CORE_PASSWORD de
      #    pulso-voz. voz se autentica contra core con POST /auth/login usando
      #    esa contraseña. Si no coinciden, el flujo de WhatsApp muere en 401 y
      #    el log sólo dice «core rechazó el login».
      - key: OPERADOR_PASSWORD
        sync: false
      # openssl rand -hex 32
      - key: SESION_SECRET
        sync: false

      # ── Credencial de plataforma (tarea 1.8) ──────────────────────────
      # Abre POST /auth/servicio, la ruta que emite el token con el que `voz`
      # se identifica. SIN ESTA VARIABLE LA RUTA NIEGA A TODO EL MUNDO y no
      # hay forma de emitir el token: el canal de WhatsApp no arranca.
      # Es la excepción a la regla de degradación del repo, a propósito.
      #   openssl rand -hex 32
      - key: PULSO_ADMIN_TOKEN
        sync: false
      # Sólo al rotar SESION_SECRET: el anterior se deja aquí y core sigue
      # aceptando 24 h los tokens ya emitidos, para que rotar no tumbe a voz.
      # - key: SESION_SECRET_ANTERIOR
      #   sync: false
      # ⚠️ TIENE QUE SER IDÉNTICO a SECRETO_ENDPOINT de pulso-voz: es el
      #    header X-Secreto con el que core llama a los endpoints /interno de
      #    voz. Distinto secreto = 403 silencioso (voz.client.ts no lanza,
      #    sólo loguea «voz /… devolvió 403»).
      - key: VOZ_SECRETO
        sync: false

      # ── Origen del navegador ──────────────────────────────────────────
      # ⚠️ La URL EXACTA de pulso-frontend, con https:// y SIN barra final.
      #    NUNCA '*': core manda cookie de sesión, y con credenciales el
      #    navegador exige un origen exacto — el comodín lo rechaza el browser,
      #    no core. `fromService` no sirve: devuelve el host pelado, sin
      #    esquema, y aquí se compara el origen completo.
      - key: CORS_ORIGIN
        sync: false
      # Front y core en dominios distintos ⇒ SameSite=None + HTTPS.
      - key: COOKIE_CROSS_SITE
        value: "true"

      # ── Identidad del turno (PR #23) ──────────────────────────────────
      # Declaraciones DEL LADO DEL SERVIDOR: quien despliega decide qué rol
      # acredita la contraseña de turno. Sin ellas la sesión no acredita
      # NINGÚN rol y responden 403 el override del CRUE
      # (POST /casos/:id/override) y la auditoría por caso. El log lo avisa al
      # arrancar, pero no tumba el servicio: se descubre al usarlo.
      - key: PULSO_ROLES_TURNO
        value: admin_organizacion
      - key: PULSO_ORGANIZACION_TURNO
        value: org-demo

      # ── Credenciales de servidor ──────────────────────────────────────
      # ⚠️ SUPABASE_URL TIENE QUE EMPEZAR POR https:// — es la URL del proyecto
      #    (https://<ref>.supabase.co), NO la cadena de Postgres, que va en
      #    PULSO_ROUTING_DATABASE_URL. Con un valor sin esquema, el cliente
      #    lanza «Invalid supabaseUrl» en onModuleInit y core NO ARRANCA: eso
      #    tumbó el primer deploy. Vacía sí es válido — ahí sí degrada a
      #    semillas y lo dice en el log.
      # Sin Supabase, core sirve las 84 sedes desde semillas compiladas.
      # Sin Mapbox, el ETA se estima por distancia. Las dos degradaciones son
      # la regla, no un bug: GET /capacidades las hace visibles.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: MAPBOX_TOKEN
        sync: false

      # ── Estado del ruteo ──────────────────────────────────────────────
      # Sin esto el estado vive en un Map en RAM (tarea 1.2): reiniciar core
      # borra casos, handshakes y el historial por sede. Es la MISMA base que
      # usa voz para deduplicar webhooks.
      - key: PULSO_ROUTING_DATABASE_URL
        sync: false

  # ── voz ───────────────────────────────────────────────────────────────
  # El ÚNICO público. Meta/Kapso le mandan webhooks y Twilio le abre un
  # WebSocket (WS /telefonia/twilio) inmediatamente después de marcar.
  - type: web
    name: pulso-voz
    runtime: docker
    dockerfilePath: ./apps/services/voz/Dockerfile
    # voz no lee data/, así que su contexto sí puede ser su propia carpeta.
    dockerContext: ./apps/services/voz
    # ⚠️ NO LO BAJES A `free`. Render duerme un web service gratuito a los 15
    #    minutos sin tráfico y despertarlo tarda ~1 minuto. Twilio abre el
    #    WebSocket justo después de marcar: con el servicio dormido la llamada
    #    se cae sin audio, y el primer WhatsApp del demo se pierde. Render
    #    soporta WebSocket en todos los planes, incluido el gratuito — el
    #    problema no es el WS, es el sueño.
    plan: starter
    region: oregon
    healthCheckPath: /health
    autoDeployTrigger: "off"

    envVars:
      - key: PORT
        value: 8090

      # La URL pública de ESTE servicio. Twilio abre un WebSocket de vuelta
      # hacia acá, así que sin esto la telefonía no suena.
      #
      # ⚠️ SE PONE A MANO: https://pulso-voz.onrender.com
      #
      #    Aquí había un `fromService … property: host` y ESTÁ MAL. En el
      #    primer deploy resolvió a "pulso-voz" pelado —el nombre interno del
      #    servicio, no el hostname público— y con eso llamadas.py arma
      #    `wss://pulso-voz/telefonia/twilio`, que no existe desde internet:
      #    la llamada se conecta y se cae sin audio. Se vio en GET /listo,
      #    campo url_publica.
      #
      #    llamadas.py::_host_publico() quita el esquema, así que da igual si
      #    la pegas con https:// o sin él. Lo que NO puede faltar es el
      #    dominio completo.
      - key: URL_PUBLICA
        sync: false

      # Hacia adentro, por la red privada. CORE_BASE_URL es la RAÍZ de core
      # (voz le pega a /auth/login), no /interno.
      - key: AI_CORE_BASE_URL
        value: http://pulso-ai-core:8000
      - key: CORE_BASE_URL
        value: http://pulso-core:3001

      # ── Secretos: se ponen a mano en el dashboard, NUNCA en este archivo ──
      # `sync: false` es justo eso: Render pide el valor y no lo versiona.

      # ⚠️ ESTA VARIABLE NO SE PUEDE LLENAR ANTES DEL PRIMER DEPLOY.
      #    Ya no es la contraseña de turno (eso hacía indistinguible un bot de
      #    una persona en la auditoría). Es un token de servicio `svc:voz` con
      #    alcance ['caso:crear','caso:leer','notificar'] que EMITE core, y core
      #    exige PULSO_ADMIN_TOKEN para emitirlo. El orden es:
      #
      #      1. desplegar core con PULSO_ADMIN_TOKEN puesto
      #      2. emitirlo contra la URL pública de core:
      #           curl -X POST https://<url-de-core>/auth/servicio \
      #                -H "x-pulso-admin-token: $PULSO_ADMIN_TOKEN" \
      #                -H 'content-type: application/json' -d '{"nombre":"voz"}'
      #      3. pegar el `token` aquí y redesplegar voz
      #
      #    /auth/servicio es @Publico() a propósito — lo que la cierra es la
      #    cabecera x-pulso-admin-token, no el guard de sesión. Sin
      #    PULSO_ADMIN_TOKEN configurada la ruta niega a todo el mundo.
      #
      # ⚠️ DURA 24 HORAS Y NO SE RENUEVA SOLO (DURACION_SERVICIO_MS en
      #    sesion.service.ts:59). Si el demo es más de un día después de
      #    emitirlo, hay que volver a emitirlo o voz deja de hablarle a core.
      #    Vacío no degrada a modo abierto: voz simplemente no llama a core y
      #    lo dice en GET /listo → core.identidad.
      - key: CORE_SERVICE_TOKEN
        sync: false
      # ⚠️ IDÉNTICO a VOZ_SECRETO de pulso-core. Protege los endpoints que
      #    disparan acciones caras (llamar por teléfono). En Render ponlo
      #    SIEMPRE: vacío significa abierto.
      - key: SECRETO_ENDPOINT
        sync: false

      # Postgres de core, donde vive `webhook_recibido` (migración 0003).
      # ⚠️ SIN ESTO LA DEDUPLICACIÓN DE WEBHOOKS ES EN MEMORIA, y en Render
      #    basta con que el plan escale a dos instancias para que un reintento
      #    de Meta despache DOS ambulancias al mismo paciente. `GET /listo`
      #    responde `deduplicacion.modo` — míralo después de cada deploy.
      #    Es la misma cadena que PULSO_ROUTING_DATABASE_URL de core.
      - key: PULSO_WEBHOOK_DATABASE_URL
        sync: false

      # ── WhatsApp ──────────────────────────────────────────────────────
      # meta | kapso. Hoy sólo "meta" está implementado: canales/whatsapp.py
      # habla con graph.facebook.com y nada lee kapso_api_key. Ver el reporte.
      - key: WHATSAPP_PROVEEDOR
        value: meta
      # ⚠️ SIN ESTO EL WEBHOOK PÚBLICO ACEPTA CUALQUIER COSA.
      #    `entorno` vale "desarrollo" por defecto (config.py:98), y en
      #    desarrollo la verificación de firma ADVIERTE Y PASA. O sea: en
      #    Render, sin estas dos, cualquiera puede hacer POST a
      #    /webhooks/whatsapp e inventar una urgencia — con un endpoint
      #    público eso no es un modo degradado, es un agujero.
      #
      #    Con ENTORNO=produccion y sin secreto, responde 401 y el canal
      #    muere. Van juntas o no van.
      #
      #    El App Secret sale de developers.facebook.com → tu App →
      #    Configuración → Básico → Aplicar secreto.
      - key: ENTORNO
        value: produccion
      - key: WHATSAPP_APP_SECRET
        sync: false

      # La cadena que TÚ inventas y le repites a Meta al registrar el webhook.
      # Es lo que Meta te devuelve en el GET de verificación; no protege el
      # POST, para eso está WHATSAPP_APP_SECRET.
      # Este repo es público: no la dejes en un valor conocido.
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      # Declarada en config.py, todavía sin código que la use.
      - key: KAPSO_API_KEY
        sync: false

      # ── Twilio ────────────────────────────────────────────────────────
      # TWILIO_PHONE_NUMBER acepta un Verified Caller ID: no hace falta
      # comprar número para que funcione el `from`.
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false

  # ── frontend ─────────────────────────────────────────────────────────
  # Las tres consolas: /campo, /hospital, /crue. Desde cualquier celular.
  #
  # `runtime: node`, no docker: no hay Dockerfile para el front y Render
  # compila Next nativo. `rootDir` hace que todo corra dentro de apps/frontend,
  # que tiene su propio lockfile y su propio pnpm-workspace.yaml.
  - type: web
    name: pulso-frontend
    runtime: node
    rootDir: apps/frontend
    # ⚠️ NADA DE `corepack enable` AQUÍ. La imagen de Render ya trae pnpm en
    #    /usr/bin/pnpm y el filesystem es de sólo lectura, así que corepack
    #    revienta al intentar reemplazar el symlink:
    #      Internal Error: EROFS: read-only file system, unlink '/usr/bin/pnpm'
    #    Eso tumbó el primer deploy. El pnpm de la imagen lee el lockfile 9.0
    #    sin problema.
    buildCommand: pnpm install --frozen-lockfile && pnpm build
    # `next start` lee PORT del entorno, que es lo que Render inyecta.
    startCommand: pnpm start
    plan: starter
    region: oregon
    autoDeployTrigger: "off"

    envVars:
      # ⚠️ TODO LO DE ABAJO SE COMPILA DENTRO DEL BUNDLE Y CUALQUIERA LO VE.
      #    Next inlinea NEXT_PUBLIC_* en tiempo de BUILD, no de arranque: para
      #    cambiar una hay que REDESPLEGAR, no basta reiniciar. Y por lo mismo,
      #    aquí no entra ni una credencial de servidor. Nunca.

      # La URL pública EXACTA de pulso-core, con https:// y sin barra final.
      # Al revés: CORS_ORIGIN de core tiene que ser la URL de ESTE servicio, o
      # el navegador bloquea cada llamada con cookie.
      - key: NEXT_PUBLIC_API_URL
        sync: false

      # Token PÚBLICO de Mapbox, sólo para pintar el mapa de /campo. Es
      # distinto del MAPBOX_TOKEN de core, que usa la Matrix API y sí es
      # secreto. Restringe este por dominio en el dashboard de Mapbox.
      - key: NEXT_PUBLIC_MAPBOX_TOKEN
        sync: false

      # Supabase para Realtime desde el navegador. La ANON key está sujeta a
      # RLS; la service role NO va aquí bajo ninguna circunstancia — esa vive
      # en pulso-core y se salta RLS.
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false

      # Mapillary: foto a nivel de calle de la llegada a la sede aceptada.
      # Sin él la foto no se pinta y el resto sigue igual.
      - key: NEXT_PUBLIC_MAPILLARY_TOKEN
        sync: false
